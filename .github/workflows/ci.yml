name: CI

on:
  push:
    branches: [master, development]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
        env:
          HUSKY: 0
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run smoke
      - run: npm run smoke:install
      - run: npm run docs
      - run: npm run smoke:docs
      - name: Check committed documentation
        run: git diff --exit-code -- docs
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:docs:browser
